%YAML:1.0

# 检测器运行参数
# 前面，后面的行尾都不能有注释！（debug）
# 程序启动时读取的配置  要求：配置文件契约对齐
# OpenCV cv::FileStorage 读取 YAML 的格式要求

 # 配置文件版本号，以后格式变了靠它区分
schema_version: 1

# 输入图像格式，BGR8 是 OpenCV 默认    # 时间戳单位，us = 微秒
input:
  pixel_format: BGR8
  timestamp_unit: us

# 处理前把图缩到 960×720  # 二值化阈值，200
preprocess:
  work_width: 960
  work_height: 720
  threshold: 200


# 用哪个检测器，SegmentedMark 执行当前帧检测
detector:
  mode: SegmentedMark

  # D11：原图角点恢复预算；与工作图几何观察分别配置。
  corner:
    # P0/P1/P2/P3 -> LT/RT/RB/LB；安装后按文档验一次，换装时显式修改。
    physical_to_screen: [0, 1, 2, 3]
    # 防歧义（候选角点）
    max_pair_disagreement_px2: 64.0

    # 拟合单条直线需要的最少观测点数量
    min_line_points: 10

    # 平均残差质量标签阈值（超限不丢角）
    max_line_fit_error: 0.5

    # 两条边允许的最小夹角（度）
    # 小于该值认为两直线近平行，交点不稳定
    min_intersection_angle_deg: 5.0

    # 交点误差质量标签阈值（超限不丢角）交点离真实拐弯有多远
    max_corner_error: 4.131595359474918

    # 角点拟合 轮廓近似参数（approxPolyDP多边形贴合轮廓允许多松）
    # 与 找四边形轮廓 geometry.approximation_epsilon 分开
    approximation_epsilon: 1.0

    # 全部为原图px，direction为度；真值2px预算仅用于验收。
    observation:
      max_edge_direction_diff_deg: 3.0
      max_edge_position_distance_px: 9.0
      turn_trim_distance_px: 2.0
      max_turn_connection_length_px: 13.5
      max_support_extension_px: 9.5
      min_support_span_px: 14.0

output:
  video_fourcc: "MJPG"
  video_filename: "overlay.avi"

# 调试开关（记录总运行时间）
debug:
  timing_enabled: 1

# 几何观察参数
geometry:
  white_threshold: 200
  approximation_epsilon: 2.0
  # 轮廓/连通块的最小面积
  min_area: 0.0

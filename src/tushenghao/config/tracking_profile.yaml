%YAML:1.0
---
# 初估、待标定：来自像素误差/焦距/距离与运动量级推导，不是视频实测。
# 方差就是“偏离均值的平方的平均”：Var(𝑋)=𝐸[(𝑋−𝜇)2]；N 个样本：σ² = (1/N) ∑(i=1 to N) (xi - x̄)²；标准差就是方差开根
# 相机坐标横向/纵深位置方差，单位 m^2；基准距离约 1 m。
# !!opencv-matrix——OpenCV 的 YAML 标签，意思是“下面这几项合起来是一个矩阵”，FileStorage 读到它就按矩阵解析
# rows: 3 / cols: 3——形状，3 行 3 列;dt: d——数据类型，d = double（CV_64F）
# data: [...]——9 个数，按行排：前 3 个是第 1 行，中间 3 个是第 2 行，后 3 个是第 3 行
# camera_mse_m2（R）：量测噪声的方差，告诉滤波器每次量测的位置有多不可信
# 现在：初估，像素误差经焦距/距离换算（基准约 1 m），非实测；横向方差 2e-8（标准差约 0.14 mm），深度 2.5e-7（约 0.5 mm）。
# 以后：静态标定——相机和 MARK 都固定，录一段视频，位置估计的方差就是 R；R 随距离变（横向 ∝ z²、深度 ∝ z⁴），在工作距离测；去掉 S 后静态测的 R 就是最终 R。
camera_mse_m2: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d
  data: [2.0e-8, 0., 0., 0., 2.0e-8, 0., 0., 0., 2.5e-7]
# RMS 加速度约 0.5–1 m/s^2、相关时间约 0.5 s，q 取 0.5 m^2/s^3。
# acceleration_psd_m2ps3（q）：过程噪声的强度，描述目标运动偏离匀速模型有多厉害，q 越大模型越不可信
# 现在：初估 0.5，按运动量级估——RMS 加速度约 0.5–1 m/s²、相关时间约 0.5 s。
# 以后：动态调——MARK 匀速 0.5 m/s 跑，以 0.5 为基准上下试，调到跟踪表现好（误差小、不滞后、NIS 合理）；匀速只能定 q 下界，调的是好用的值，不是精确真值。
# 白噪声加速度模型：一个 q 就决定了整个 Q
acceleration_psd_m2ps3: 0.5
# 速度量级 0.5 m/s，初速标准差取 0.5 m/s。
# initial_velocity_variance_m2ps2（vv）：建轨时速度猜测的不确定度，说明“速度是 0”这个先验可能错多少
# 现在：0.25，速度量级 0.5 m/s，初速标准差取 0.5 m/s，方差 0.5² = 0.25。
# 以后：不动。只是建轨时速度猜测的方差，第二帧 bootstrap 算出真速度就覆盖了，初值洗几帧就没影响。
initial_velocity_variance_m2ps2: 0.25
